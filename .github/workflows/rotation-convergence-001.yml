name: RC-001 conventional scalar baseline
on:
  push:
    paths:
      - "research/rotation-convergence-001/**"
      - ".github/workflows/rotation-convergence-001.yml"
  pull_request:
    paths:
      - "research/rotation-convergence-001/**"
  workflow_dispatch:

jobs:
  numeric-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Run reproducible conventional scalar control
        run: python research/rotation-convergence-001/experiment.py

# This workflow DOES NOT compile RotationBridge.lean or validate EFMW/C1.
